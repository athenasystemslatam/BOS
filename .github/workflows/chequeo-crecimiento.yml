name: Chequeo de Crecimiento

on:
  schedule:
    - cron: '0 11 * * 1'   # 11:00 UTC = 8:00 AM ART, todos los lunes
  workflow_dispatch:         # disparo manual desde GitHub Actions

permissions:
  issues: write

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - name: Chequear crecimiento de la base
        env:
          URL: "https://bos-plum.vercel.app/api/cron/chequeo-crecimiento"
        run: |
          # Falla si la respuesta no es 200 (antes un 307 al login pasaba como éxito).
          code=$(curl -s -o respuesta.txt -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          cat respuesta.txt; echo
          if [ "$code" != "200" ]; then echo "::error::BOS respondió $code (se esperaba 200)"; exit 1; fi

  avisar:
    needs: [chequeo]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Abrir issue en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "⚠ Chequeo de crecimiento falló — $(date -u +'%Y-%m-%d')" --body "La tarea automática de BOS no se completó. Ver el log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
