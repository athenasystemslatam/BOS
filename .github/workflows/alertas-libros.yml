name: Alertas Libros

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 8:00 ART
  workflow_dispatch:

jobs:
  alertas-libros:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alertas Libros
        run: |
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://bos-plum.vercel.app/api/alertas/libros"
